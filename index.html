    <script>
      // Resolve the theme before first paint. Plateful stores the choice in localStorage
      // (no cookies, see REQUIREMENTS FR-LEGAL-6), so the design system's cookie-based init
      // script is not used.
      (function () {
        var root = document.documentElement;
        var theme = null;
        root.classList.add('js');
        try { theme = localStorage.getItem('plateful:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.dataset.theme = theme;
      })();
    </script>
