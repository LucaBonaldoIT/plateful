<!doctype html>
<html lang="en">
  <head>
    <script>
      // Resolve the theme before first paint. Plateful stores the choice in localStorage
      // (no cookies, see REQUIREMENTS FR-LEGAL-6), so the design system's cookie-based init
      // script is not used.
      (function () {
        var root = document.documentElement;
        var theme = null;
        root.classList.add('js');
        try { theme = localStorage.getItem('plateful:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.dataset.theme = theme;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="description" content="Plan a week of meals for your household and get the grocery list. Offline, no account, no cookies." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://plateful.lucabonaldo.dev/" />
    <title>Plateful — weekly meals and grocery list</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
